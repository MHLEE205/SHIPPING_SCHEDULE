var SP_EMAIL_FILE_PATH = '古紙/-. AI 活用/Z-01 -LEENAI-SCHEDULE/Shipping Schedule(E-mail ADD).xlsm';

/* ═══════════════════════════════════════════
   LEENAI 初期化
═══════════════════════════════════════════ */
function startTool(){
  /* ファイルハンドル復元 */
  (async function(){
    try{
      var eh=await dbGet('emailFile');
      if(eh){
        var perm=await eh.queryPermission({mode:'read'});
        if(perm==='granted'){emailFileHandle=eh;await loadEmailMaster();}
        else{emailFileHandle=eh;document.getElementById('emailFileStatus').textContent='📄 '+eh.name+'  （権限確認中）';}
      }
    }catch(e){}
  })();
  autoLoadEmailMaster();
  loadFromD365();
}

LEENAI.init({
  sys:         'B-02',
  name:        '出荷スケジュール 送付ツール',

  date:        '2026-10-16',

/* ── ローディング (共通に委譲) ── */
function showLoading(msg){ LEENAI.loading.show(msg||'データ取得中...'); }
function hideLoading(){ LEENAI.loading.hide(); }

/* ═══════════════════════════════════════════
   IndexedDB
═══════════════════════════════════════════ */
async function openDb(){
  return new Promise(function(res,rej){
    var r=indexedDB.open(FS_DB,1);
    r.onupgradeneeded=function(e){e.target.result.createObjectStore('handles');};
    r.onsuccess=function(e){res(e.target.result);};
    r.onerror=function(e){rej(e.target.error);};
  });
}
async function dbGet(key){
  var db=await openDb();
  return new Promise(function(res,rej){
    var r=db.transaction('handles','readonly').objectStore('handles').get(key);
    r.onsuccess=function(e){res(e.target.result);};
    r.onerror=function(e){rej(e.target.error);};
  });
}
async function dbSet(key,val){
  var db=await openDb();
  return new Promise(function(res,rej){
    var r=db.transaction('handles','readwrite').objectStore('handles').put(val,key);
    r.onsuccess=function(){res();};
    r.onerror=function(e){rej(e.target.error);};
  });
}

/* ═══════════════════════════════════════════
   E-mailマスター SharePoint 自動取得
═══════════════════════════════════════════ */
function autoLoadEmailMaster(){
  var statusEl=document.getElementById('emailFileStatus');
  autoLoadPromise=(async function(){
    try{
      statusEl.textContent='⟳ SharePointからE-mailマスター取得中...';
      var grTok=await LEENAI.auth.token('graph');
      if(!grTok){
        statusEl.textContent='⚠️ 自動取得失敗（Graph接続なし） → 手動で選択してください';
        addLog('⚠️ [SP] Graph接続なし → スキップ','warn');
        return;
      }
      var encoded=SP_EMAIL_FILE_PATH.split('/').map(encodeURIComponent).join('/');
      var url='https://graph.microsoft.com/v1.0/drives/'+SP_DRIVE_ID+'/root:/'+encoded+':/content';
      addLog('📡 [SP] DriveID方式で取得中...','ok');
      var res=await fetch(url,{headers:{'Authorization':'Bearer '+grTok}});
      if(!res.ok){
        var detail='';
        try{var j=await res.json();detail=j&&j.error&&j.error.message||'';}catch(_){}
        throw new Error('HTTP '+res.status+(detail?' / '+detail:''));
      }
      var buf=await res.arrayBuffer();
      var wb=XLSX.read(new Uint8Array(buf),{type:'array',raw:true});
      emailFileHandle=null;
      parseEmailMaster(wb,'Shipping Schedule(E-mail ADD).xlsm [SP自動取得]');
      addLog('✅ [SP] E-mailマスター取得成功','ok');
    }catch(e){
      statusEl.textContent='⚠️ 自動取得失敗 → 手動で選択してください';
      addLog('❌ [SP] 自動取得失敗: '+e.message,'err');
    }finally{
      autoLoadPromise=null;
    }
  })();
}

/* ═══════════════════════════════════════════
   E-mailマスター 手動選択
═══════════════════════════════════════════ */
async function selectEmailFile(){
  if(!window.showOpenFilePicker){showError('このブラウザはファイル選択に対応していません。Chrome/Edgeをご使用ください。');return;}
  try{
    var handles=await window.showOpenFilePicker({types:[{description:'Excel Files',accept:{
      'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx'],
      'application/vnd.ms-excel.sheet.macroenabled.12':['.xlsm'],
    }}],multiple:false});
    emailFileHandle=handles[0];
    await dbSet('emailFile',handles[0]);
    document.getElementById('emailFileStatus').textContent='📄 '+handles[0].name+'  読み込み中...';
    await loadEmailMaster();
  }catch(e){
    if(e.name!=='AbortError') showError('ファイル選択エラー: '+e.message);
  }
}

async function loadEmailMaster(){
  if(!emailFileHandle) return;
  try{
    var perm=await emailFileHandle.queryPermission({mode:'read'});
    if(perm!=='granted') perm=await emailFileHandle.requestPermission({mode:'read'});
    if(perm!=='granted'){showError('E-mailマスターファイルのアクセス権限がありません。');return;}
    var file=await emailFileHandle.getFile();
    var buf=await file.arrayBuffer();
    var wb=XLSX.read(new Uint8Array(buf),{type:'array',raw:true});
    parseEmailMaster(wb);
  }catch(e){
    showError('E-mailマスター読み込みエラー: '+e.message);
  }
}

/* ═══════════════════════════════════════════
   Graph API: メール送信
═══════════════════════════════════════════ */
async function sendMailGraph(b){
  var grTok=await LEENAI.auth.token('graph');
  if(!grTok){alert('Outlookへの接続がありません。再ログインしてください。');return false;}
  var ymd=todayYMD();
  var subject='[LEENEAR AutoSend] '+b.buyer+' - Shipping Schedule '+ymd;
  var contracts=[],poNos=[],seen=new Set(),poSameAsCo=true;
  b.rows.forEach(function(r){
    var co=(r.coNo||'').toString().trim(),po=(r.poNo||'').toString().trim();
    if(co&&!seen.has(co)){seen.add(co);contracts.push(co);}
    if(po&&po!==co&&!poNos.includes(po)) poNos.push(po);
    if(po&&po!==co) poSameAsCo=false;
  });
  var contractLine='',poLine='';
  if(poSameAsCo||poNos.length===0){contractLine=contracts.length?'  Contract / PO No. : '+contracts.join(' / '):'';}
  else{contractLine=contracts.length?'  Contract          : '+contracts.join(' / '):'';poLine=poNos.length?'  PO No.            : '+poNos.join(' / '):'';}
  var infoBlock=[contractLine,poLine,'  Buyer             : '+b.buyer].filter(Boolean).join('\n');
  var bodyText=['Dear Sir/Madam,','','Please kindly find the attached shipping schedule.','',infoBlock,'',
    'Please feel free to contact us if you have any questions.','','Thanks,','Best regards,','',
    'LEENEAR CORPORATION','TEL: +81-3-3528-9850  FAX: +81-3-3528-9851',
    'E-mail: rcp@leenearcorp.com','Web: www.leenearcorp.com',
    '─────────────────────────────────────────','✦ Powered by LEENAI Automation System'].join('\r\n');
  var ccAddresses=[b.emailCC,'rcp@leenearcorp.com']
    .flatMap(function(s){return (s||'').split(';');}).filter(Boolean)
    .filter(function(v,i,a){return a.indexOf(v)===i;})
    .map(function(addr){return {emailAddress:{address:addr}};});
  var excelData=generateExcel(b);
  var bytes2=new Uint8Array(excelData),binary='';
  for(var i=0;i<bytes2.length;i+=8192){binary+=String.fromCharCode.apply(null,bytes2.subarray(i,i+8192));}
  var base64=btoa(binary),fileName='Shipping Schedule_'+b.buyer+'_'+ymd+'.xlsx';
  var message={subject:subject,body:{contentType:'Text',content:bodyText},
    toRecipients:[{emailAddress:{address:b.emailTo}}],ccRecipients:ccAddresses,
    attachments:[{'@odata.type':'#microsoft.graph.fileAttachment',name:fileName,
      contentType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',contentBytes:base64}]};
  var resp=await fetch('https://graph.microsoft.com/v1.0/me/sendMail',{method:'POST',
    headers:{'Authorization':'Bearer '+grTok,'Content-Type':'application/json'},
    body:JSON.stringify({message:message,saveToSentItems:true})});
  if(resp.status===202) return true;
  if(resp.status===401) throw new Error('トークンが期限切れです。再度ログインしてください。');
  var err=await resp.text();
  throw new Error('Graph API エラー ('+resp.status+'): '+err);
}

    .map(function(addr){return {emailAddress:{address:addr}};});
  var excelData=generateExcel(b);
  var bytes2=new Uint8Array(excelData),binary='';
  for(var i=0;i<bytes2.length;i+=8192){binary+=String.fromCharCode.apply(null,bytes2.subarray(i,i+8192));}
  var base64=btoa(binary),fileName='Shipping Schedule_'+b.buyer+'_'+ymd+'.xlsx';
  var message={subject:subject,body:{contentType:'Text',content:bodyText},
    toRecipients:[{emailAddress:{address:b.emailTo}}],ccRecipients:ccAddresses,
    attachments:[{'@odata.type':'#microsoft.graph.fileAttachment',name:fileName,
      contentType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',contentBytes:base64}]};
  var resp=await fetch('https://graph.microsoft.com/v1.0/me/messages',{method:'POST',
    headers:{'Authorization':'Bearer '+grTok,'Content-Type':'application/json'},body:JSON.stringify(message)});
  if(resp.status===201){var draft=await resp.json();return draft.id;}
  if(resp.status===401) throw new Error('トークンが期限切れです。再度ログインしてください。');
  var err2=await resp.text();
  throw new Error('Graph API エラー ('+resp.status+'): '+err2);
}

async function d365Get(relUrl,token){
  var url=relUrl.startsWith('http')?relUrl:D365.apiBase+relUrl;
  var resp=await fetch(url,{headers:{'Authorization':'Bearer '+token,'Accept':'application/json',
    'OData-MaxVersion':'4.0','OData-Version':'4.0','Prefer':'odata.include-annotations="*"'}});
  if(!resp.ok){var txt=await resp.text();throw new Error('D365 API エラー '+resp.status+': '+txt.slice(0,200));}
  var data=await resp.json();return data.value||data;
}

async function fetchActiveContractGuids(token){
  addLog('🔍 Step1: 未完了契約を取得中...','');
  var contractGuids=new Set();
  var url='cr49f_sale_details?$filter=cr49f_closing eq false&$select=cr49f_sale_detail_id,_cr49f_sale_contract_id_value&$top=500';
  while(url){
    var page=await d365Get(url,token);
    var rows=Array.isArray(page)?page:(page.value||[page]);
    rows.forEach(function(r){if(r._cr49f_sale_contract_id_value) contractGuids.add(r._cr49f_sale_contract_id_value);});
    url=page['@odata.nextLink']||null;
  }
  addLog('✅ Step1完了: 未完了契約 '+contractGuids.size+' 件','ok');
  return [...contractGuids];
}

async function fetchBookingsByContracts(contractGuids,token){
  addLog('📦 Step2: ブッキング情報を取得中...','');
  var all=[],CHUNK=10;
  for(var i=0;i<contractGuids.length;i+=CHUNK){
    var chunk=contractGuids.slice(i,i+CHUNK);
    var filter=chunk.map(function(g){return '_cr49f_sale_contract_id_value eq '+g;}).join(' or ');
    var expand='cr49f_sale_contract_id($select=cr49f_sale_contract_no,cr49f_sale_contract_date,cr49f_latest_shipment,cr49f_po_no;$expand=cr49f_buyer_id($select=cr49f_buyer_name,cr49f_buyer),cr49f_agent_id($select=cr49f_agent_name,cr49f_agent)),cr49f_carrier_id($select=crcf9_carrier),cr49f_region_japan_id($select=crcf9_pol),cr49f_region_id($select=cr49f_pod)';
    var url2='cr49f_bookings?$filter='+filter+'&$select=cr49f_bookingid,cr49f_bl_number,cr49f_booking_no,cr49f_invoice_no,cr49f_main_ship_name,cr49f_etd,cr49f_eta,crcf9_bl_etd,crcf9_bl_eta,_cr49f_sale_contract_id_value&$expand='+expand;
    var rows=await d365Get(url2,token);
    all.push.apply(all,Array.isArray(rows)?rows:[rows]);
    setProgress(20+Math.round(30*(i/contractGuids.length)),'ブッキング取得中 '+all.length+'件...');
  }
  addLog('✅ Step2完了: ブッキング '+all.length+' 件','ok');
  return all;
}

async function fetchContainerInfos(bookingGuids,token){
  addLog('🚢 Step3: コンテナ情報を取得中...','');
  var all=[],CHUNK=10;
  for(var i=0;i<bookingGuids.length;i+=CHUNK){
    var chunk=bookingGuids.slice(i,i+CHUNK);
    var filter=chunk.map(function(g){return '_crcf9_booking_id_value eq '+g;}).join(' or ');
    var url2='crcf9_container_informations?$filter='+filter+'&$select=crcf9_container_informationid,_crcf9_booking_id_value,crcf9_n_w,crcf9_container_no,crcf9_type&$expand=crcf9_item_id($select=cr49f_item,cr49f_item_name),crcf9_sale_detail_id($select=cr49f_price,cr49f_quantity)';
    var rows=await d365Get(url2,token);

function buildScheduleRowsFromD365(bookings,containerInfos){
  var ciByBooking={};
  containerInfos.forEach(function(ci){
    var bkId=ci._crcf9_booking_id_value;
    if(!ciByBooking[bkId]) ciByBooking[bkId]=[];
    ciByBooking[bkId].push(ci);
  });
  var rows=[];
  bookings.forEach(function(bk){
    var sc=bk.cr49f_sale_contract_id||{};
    var bd=sc.cr49f_buyer_id||{},ad=sc.cr49f_agent_id||{};
    var buyerName=(bd.cr49f_buyer||'').trim();
    var agentRaw=(ad.cr49f_agent||'').toString().trim();
    var agentName=/^\d+$/.test(agentRaw)?'':agentRaw;
    var carrier=bk.cr49f_carrier_id&&bk.cr49f_carrier_id.crcf9_carrier||'';
    var pol=bk.cr49f_region_japan_id&&bk.cr49f_region_japan_id.crcf9_pol||'';
    var pod=bk.cr49f_region_id&&bk.cr49f_region_id.cr49f_pod||'';
    var blDate=bk.crcf9_bl_etd?bk.crcf9_bl_etd.slice(0,10).replace(/-/g,'/'):'';
    var blDateRaw=bk.crcf9_bl_etd?new Date(bk.crcf9_bl_etd):null;
    var etaRaw_=bk.crcf9_bl_eta||bk.cr49f_eta||null;
    var eta=etaRaw_?etaRaw_.slice(0,10).replace(/-/g,'/'):'';
    var etdRaw=bk.cr49f_etd?new Date(bk.cr49f_etd):null;
    var cts=ciByBooking[bk.cr49f_bookingid]||[];
    var containerCount=cts.length,comboMap={};
    cts.forEach(function(ci){
      var item=ci.crcf9_item_id&&ci.crcf9_item_id.cr49f_item||'';
      var price=ci.crcf9_sale_detail_id&&ci.crcf9_sale_detail_id.cr49f_price!=null?ci.crcf9_sale_detail_id.cr49f_price:'';
      var qty=Number(ci.crcf9_sale_detail_id&&ci.crcf9_sale_detail_id.cr49f_quantity||0);
      var nwKg=ci.crcf9_n_w!=null?Number(ci.crcf9_n_w):0;
      var key=item+'||'+price;
      if(!comboMap[key]) comboMap[key]={item:item,price:price,qty:qty,netWkg:0};
      comboMap[key].netWkg+=nwKg;
    });
    var totalNWkg=Object.values(comboMap).reduce(function(s,c){return s+c.netWkg;},0);
    if(totalNWkg===0&&containerCount===0) return;
    var coNo=sc.cr49f_sale_contract_no||'',nwMap={},qtyMap={};
    Object.values(comboMap).forEach(function(combo){
      var key=coNo+'||'+combo.item+'||'+combo.price;
      nwMap[key]=Math.round(combo.netWkg/10)/100;qtyMap[key]=combo.qty;
    });
    rows.push({buyer:buyerName,agent:agentName,invoiceNo:bk.cr49f_invoice_no||'',
      blNo:bk.cr49f_bl_number||'',bookingNo:bk.cr49f_booking_no||'',vessel:bk.cr49f_main_ship_name||'',
      carrier:carrier,pol:pol,pod:pod,blDate:blDate,blDateRaw:blDateRaw,eta:eta,etdRaw:etdRaw,
      coNo:coNo,poNo:sc.cr49f_po_no||'',container:String(containerCount),nwMap:nwMap,qtyMap:qtyMap});
  });
  rows.sort(function(a,b){
    var da=a.blDateRaw||a.etdRaw,db=b.blDateRaw||b.etdRaw;
    if(!da&&!db) return 0;if(!da) return 1;if(!db) return -1;return da-db;
  });
  return rows;
}

function buildBuyerData(scheduleRows,mailMap){
  var groups={};
  scheduleRows.forEach(function(r){if(!groups[r.buyer]) groups[r.buyer]=[];groups[r.buyer].push(r);});
  Object.values(groups).forEach(function(rows){
    rows.sort(function(a,b){
      var da=a.blDateRaw||a.etdRaw,db=b.blDateRaw||b.etdRaw;
      if(!da&&!db) return 0;if(!da) return 1;if(!db) return -1;return da-db;
    });
  });
  buyerData=Object.entries(groups).map(function(entry){
    var buyer=entry[0],rows=entry[1];
    var agent=(rows[0].agent||'').toString().trim();
    var agentIsZero=agent===''||/^\d+$/.test(agent);
    var resolved=null,sendType='';
    if(!agentIsZero){
      var ik=agent+'::'+buyer;
      if(mailMap[ik]){resolved=mailMap[ik];sendType='importer';}
      else{var ak=agent+'::';if(mailMap[ak]){resolved=mailMap[ak];sendType='agent';}}
    }else{var dk='::'+buyer;if(mailMap[dk]){resolved=mailMap[dk];sendType='direct';}}
    var vd=rows.map(function(r){return r.etdRaw;}).filter(Boolean);
    return{buyer:buyer,agent:agentIsZero?'':agent,rows:rows,
      emailTo:resolved?resolved.to:'',emailCC:resolved?resolved.cc:'',
      sendType:resolved?sendType:'nomail',
      etdMin:vd.length?new Date(Math.min.apply(null,vd)):null,
      etdMax:vd.length?new Date(Math.max.apply(null,vd)):null,selected:false};
  });
  buyerData.sort(function(a,b){return a.buyer.localeCompare(b.buyer);});
  filteredData=[...buyerData];
  renderStats();renderTable();
  document.getElementById('summaryBar').style.display='flex';
  document.getElementById('controls').style.display='flex';
  document.getElementById('tableWrap').style.display='block';
  document.getElementById('sendPanel').style.display='flex';
}

      buildBuyerData(scheduleRows,mailMapGlobal);addLog('✅ 完了 (D365+メールマスター統合)','ok');
    }else if(autoLoadPromise){
      window._pendingScheduleRows=scheduleRows;addLog('⟳ E-mailマスター取得完了を待機中...','ok');
      await autoLoadPromise;
      if(Object.keys(mailMapGlobal).length>0){buildBuyerData(scheduleRows,mailMapGlobal);window._pendingScheduleRows=null;addLog('✅ 完了 (D365+メールマスター統合)','ok');}
      else{addLog('⚠️ E-mailマスターの自動取得に失敗しました。手動で選択してください。','warn');}
    }else{window._pendingScheduleRows=scheduleRows;addLog('⚠️ E-mailマスターExcelを読み込んでください（下のボタン）','warn');}
    setProgress(100,'');
    document.getElementById('d365Status').textContent='✅ COMPASSデータ取得完了 ('+scheduleRows.length+'行)';
    document.getElementById('d365Status').style.color='var(--ok)';
  }catch(e){
    showError('D365エラー: '+e.message);addLog('❌ '+e.message,'err');
    document.getElementById('d365Status').textContent='❌ 取得失敗';
    document.getElementById('d365Status').style.color='var(--danger)';
  }finally{hideLoading();if(btn) btn.disabled=false;}
}

async function loadFromFile(){
  showError('');setProgress(0,'');log('');

    var perm=await fileHandle.queryPermission({mode:'read'});

    addLog('✅ '+fileHandle.name+' を読み込み中...','ok');setProgress(20,'Excelを読み込み中...');

    setProgress(50,'データを解析中...');parseEmailMaster(wb);
    setProgress(100,'完了');document.getElementById('progressWrap').style.display='none';
  }catch(e){showError('Excelの読み込みに失敗しました。\nエラー: '+e.message);}

function parseEmailMaster(wb,fileNameOverride){
  var emailSheet=wb.Sheets['E-mail'];
  if(!emailSheet){showError('「E-mail」シートが見つかりません。');return;}
  var emailRows=XLSX.utils.sheet_to_json(emailSheet,{defval:null,raw:true});
  var mailMap={};
  emailRows.forEach(function(r){
    var agent=(r['AGENT']||'').toString().trim(),buyer=(r['BUYER']||'').toString().trim();
    var emails=['E-MAIL1','E-MAIL2','E-MAIL3','E-MAIL4','E-MAIL5','E-MAIL6','E-MAIL7']
      .map(function(k){return (r[k]||'').toString().trim();}).filter(Boolean);
    mailMap[agent+'::'+buyer]={to:emails[0]||'',cc:emails.slice(1).join(';'),agent:agent,buyer:buyer};
  });
  mailMapGlobal=mailMap;
  addLog('📧 E-mailマスター: '+emailRows.length+' 件','ok');
  document.getElementById('emailFileStatus').textContent=
    '📄 '+(fileNameOverride||(emailFileHandle?emailFileHandle.name:'E-mailマスター'))+'  ✅ 読み込み済み ('+emailRows.length+'件)';
  if(window._pendingScheduleRows&&window._pendingScheduleRows.length>0){
    buildBuyerData(window._pendingScheduleRows,mailMapGlobal);
    addLog('✅ 完了 (D365+メールマスター統合)','ok');window._pendingScheduleRows=null;
  }
}

function toJsDate(v){
  if(!v) return null;if(v instanceof Date) return v;
  if(typeof v==='number') return new Date(Math.round((v-25569)*86400*1000));
  if(typeof v==='string'&&v.trim()){var d=new Date(v);return isNaN(d)?null:d;}
  return null;
}
function excelDateToStr(v){var d=toJsDate(v);if(!d) return '';
  return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');}
function dateToYMD(d){if(!d) return '';
  return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');}
function todayYMD(){return dateToYMD(new Date()).replace(/\//g,'');}

function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toggleAll(chk){filteredData.forEach(function(b){b.selected=chk.checked;});buyerData.forEach(function(b){if(filteredData.includes(b)) b.selected=chk.checked;});renderTable();}
function toggleRow(idx,chk){filteredData[idx].selected=chk.checked;updateSelCount();}
function selectAll(v){filteredData.forEach(function(b){b.selected=v;});buyerData.forEach(function(b){b.selected=v;});renderTable();}
function selectMailable(){filteredData.forEach(function(b){b.selected=b.sendType!=='nomail';});buyerData.forEach(function(b){b.selected=filteredData.includes(b)?b.selected:false;});renderTable();}
function updateSelCount(){document.getElementById('selCount').textContent=buyerData.filter(function(b){return b.selected;}).length;}
function filterTable(){
  var q=document.getElementById('searchBox').value.toLowerCase();
  filteredData=q?buyerData.filter(function(b){return b.buyer.toLowerCase().includes(q);}):([...buyerData]);
  renderTable();
}

/* ═══════════════════════════════════════════
   Excel 生成
═══════════════════════════════════════════ */
function generateExcel(b){
  var wb2=XLSX.utils.book_new(),ws={};
  var enc=function(r,c){return XLSX.utils.encode_cell({r:r,c:c});};
  var NAVY='0F2044',LBLUE='D6E4F0',HBLUE='2E75B6',WHITE='FFFFFF',GRAY='F2F2F2',TOTAL='BDD7EE';
  var fnt=function(bold,color,sz){return {bold:bold,color:{rgb:color||'000000'},sz:sz||9,name:'Arial'};};
  var fill=function(c){return {patternType:'solid',fgColor:{rgb:c}};};
  var aln=function(h,v,wrap){return {horizontal:h||'center',vertical:v||'center',wrapText:!!wrap};};
  var bdr=function(style,color){var s={style:style||'thin',color:{rgb:color||'9DC3E6'}};return {top:s,bottom:s,left:s,right:s};};
  var bdrMed=function(){var s={style:'medium',color:{rgb:NAVY}};return {top:s,bottom:s,left:s,right:s};};
  var setC=function(addr,v,s){ws[addr]={v:v,t:typeof v==='number'?'n':'s',s:s||{}};};
  var setN=function(addr,v,s){ws[addr]={v:Number(v)||0,t:'n',s:s||{}};};
  var combos=[],seen=new Set();
  b.rows.forEach(function(r){Object.keys(r.nwMap).forEach(function(key){
    if(!seen.has(key)){seen.add(key);var p=key.split('||');combos.push({co:p[0],item:p[1],price:Number(p[2]),qty:r.qtyMap[key]||0,po:r.poNo||''});}
  });});
  combos.sort(function(a,b2){return a.co.localeCompare(b2.co)||a.item.localeCompare(b2.item)||a.price-b2.price;});
  var N_FIXED=10;
  setC(enc(0,0),'Buyer',{font:fnt(true,NAVY,9),alignment:aln('left')});
  setC(enc(0,1),b.buyer,{font:fnt(true,NAVY,11),alignment:aln('left')});
  for(var r=1;r<=4;r++){for(var c=0;c<9;c++){ws[enc(r,c)]={v:'',t:'s',s:{fill:fill(LBLUE)}};}}
  setC(enc(1,0),b.buyer,{font:fnt(true,NAVY,22),fill:fill(LBLUE),alignment:aln('center','center')});
  ['CO_NO','PO_NO','GRADE','U/P'].forEach(function(lbl,bi){
    var row=1+bi;
    setC(enc(row,9),lbl,{font:fnt(true,WHITE,8),fill:fill(HBLUE),alignment:aln('center'),border:bdr()});
    combos.forEach(function(combo,ci){
      var v=bi===0?combo.co:bi===1?combo.po:bi===2?combo.item:combo.price;
      var col=N_FIXED+ci;
      if(bi===3){setN(enc(row,col),v,{font:fnt(false,NAVY,8),fill:fill(LBLUE),alignment:aln('center'),border:bdr(),numFmt:'#,##0'});}
      else{setC(enc(row,col),String(v||''),{font:fnt(bi===0,NAVY,8),fill:fill(LBLUE),alignment:aln('center'),border:bdr()});}
    });
  });
  var HDR_ROW=5;
  ['BL DATE','ETA','Invoice No.','Carrier','Vessel','Booking No.','BL No.','POL','POD','Container'].forEach(function(h,i){
    setC(enc(HDR_ROW,i),h,{font:fnt(true,WHITE,9),fill:fill(NAVY),alignment:aln('center','center',true),border:bdr()});
  });
  combos.forEach(function(combo,ci){setC(enc(HDR_ROW,N_FIXED+ci),combo.qty+' MT',{font:fnt(true,WHITE,8),fill:fill(NAVY),alignment:aln('center'),border:bdr()});});
  var DATA_START=6;
  b.rows.forEach(function(r,ri){
    var row=DATA_START+ri,bg=ri%2===0?WHITE:GRAY;
    [r.blDate,r.eta,r.invoiceNo,r.carrier,r.vessel,r.bookingNo,r.blNo||'',r.pol,r.pod,r.container].forEach(function(v,ci){
      setC(enc(row,ci),String(v||''),{font:fnt(ci===0,'000000',8),fill:fill(bg),alignment:aln('center'),border:bdr()});
    });
    combos.forEach(function(combo,ci){
      var col=N_FIXED+ci,key=combo.co+'||'+combo.item+'||'+combo.price,nw=r.nwMap[key];
      if(nw){setN(enc(row,col),Math.round(Number(nw)*100)/100,{font:fnt(false,'000000',8),fill:fill(bg),alignment:aln('right'),border:bdr(),numFmt:'#,##0.00'});}
      else{ws[enc(row,col)]={v:'',t:'s',s:{fill:fill(bg),border:bdr()}};}
    });
  });
  var TOTAL_ROW=DATA_START+b.rows.length;
  for(var c2=0;c2<N_FIXED;c2++){ws[enc(TOTAL_ROW,c2)]={v:c2===0?'Total':'',t:'s',s:{font:fnt(true,NAVY,9),fill:fill(TOTAL),alignment:aln(c2===0?'center':'left'),border:bdrMed()}};}
  combos.forEach(function(combo,ci){
    var key=combo.co+'||'+combo.item+'||'+combo.price;
    var total=b.rows.reduce(function(sum,r){return sum+(Number(r.nwMap[key])||0);},0);
    setN(enc(TOTAL_ROW,N_FIXED+ci),Math.round(total*100)/100,{font:fnt(true,NAVY,9),fill:fill(TOTAL),alignment:aln('right'),border:bdrMed(),numFmt:'#,##0.00'});
  });
  ws['!merges']=[{s:{r:0,c:1},e:{r:0,c:5}},{s:{r:1,c:0},e:{r:4,c:8}},{s:{r:TOTAL_ROW,c:0},e:{r:TOTAL_ROW,c:N_FIXED-1}}];
  ws['!cols']=[...[11,11,14,10,24,15,18,9,10,13].map(function(w){return {wch:w};}), ...combos.map(function(){return {wch:10};})];
  ws['!rows']=Array.from({length:TOTAL_ROW+1},function(_,i){
    if(i>=1&&i<=4) return {hpt:18};if(i===HDR_ROW) return {hpt:20};if(i===TOTAL_ROW) return {hpt:18};return {hpt:15};
  });
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:TOTAL_ROW,c:N_FIXED+combos.length-1}});
  ws['!pageSetup']={orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0};
  XLSX.utils.book_append_sheet(wb2,ws,'Shipping Schedule');
  return XLSX.write(wb2,{bookType:'xlsx',type:'array',cellStyles:true});
}

/* ═══════════════════════════════════════════
   mailto / 送付
═══════════════════════════════════════════ */
function buildMailto(b){
  var ymd=todayYMD();
  var subject='[LEENEAR AutoSend] '+b.buyer+' - Shipping Schedule '+ymd;
  var body='Dear Sir/Madam,\r\n\r\nPlease kindly find the latest shipping schedule for "'+b.buyer+'"\r\n\r\nThanks,\r\nBest regards,';
  var cc=[b.emailCC,'rcp@leenearcorp.com'].flatMap(function(s){return (s||'').split(';');})
    .filter(Boolean).filter(function(v,i,a){return a.indexOf(v)===i;}).join(';');
  return 'mailto:'+encodeURIComponent(b.emailTo)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)+(cc?'&cc='+encodeURIComponent(cc):'');
}

function downloadExcel(b){
  var data=generateExcel(b);
  var blob=new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='Shipping Schedule_'+b.buyer+'_'+todayYMD()+'.xlsx';a.click();
  setTimeout(function(){URL.revokeObjectURL(url);},5000);
}

async function sendOne(idx){
  var b=filteredData[idx];if(!b||b.sendType==='nomail') return;
  downloadExcel(b);await sleep(400);window.location.href=buildMailto(b);
  addLog('📤 '+b.buyer+' → Outlook を開きました','ok');
}

async function sendSelected(){
  var targets=buyerData.filter(function(b){return b.selected&&b.sendType!=='nomail';});
  if(!targets.length){alert('送付可能なバイヤーが選択されていません。');return;}
  document.getElementById('progressWrap').style.display='block';setProgress(0,'');log('');
  for(var i=0;i<targets.length;i++){
    var b=targets[i];setProgress(Math.round((i/targets.length)*100),b.buyer+' を処理中...');
    addLog('📄 '+b.buyer+': Excel生成 → ダウンロード','');downloadExcel(b);await sleep(600);
    addLog('📤 '+b.buyer+': Outlook 起動','ok');window.location.href=buildMailto(b);await sleep(1500);
  }
  setProgress(100,'完了');addLog('✅ '+targets.length+' 件の処理が完了しました','ok');
}

/* ═══════════════════════════════════════════
   プレビュー Modal
═══════════════════════════════════════════ */
function previewOne(idx){
  var b=filteredData[idx];currentModalBuyer=b;
  var ymd=todayYMD();
  var subject='[LEENEAR AutoSend] '+b.buyer+' - Shipping Schedule '+ymd;
  var cc=[b.emailCC,'rcp@leenearcorp.com'].flatMap(function(s){return (s||'').split(';');})
    .filter(Boolean).filter(function(v,i,a){return a.indexOf(v)===i;}).join('、');
  document.getElementById('modalTitle').textContent='メール確認 — '+b.buyer;
  var rows_preview=b.rows.slice(0,5).map(function(r){
    return '<tr><td>'+r.etd+'</td><td>'+r.eta+'</td><td>'+escHtml(r.invoiceNo)+'</td><td>'+escHtml(r.carrier)+'</td><td>'+escHtml(r.vessel)+'</td><td>'+escHtml(r.pol)+'</td><td>'+escHtml(r.pod)+'</td><td>'+escHtml(r.container)+'</td></tr>';
  }).join('');
  var more=b.rows.length>5?'<tr><td colspan="8" style="text-align:center;color:var(--text3);font-size:.75rem">... 他 '+(b.rows.length-5)+' 行</td></tr>':'';
  var mc=[],mp=[],ms=new Set(),mpsa=true;
  b.rows.forEach(function(r){
    var co=(r.coNo||'').toString().trim(),po=(r.poNo||'').toString().trim();
    if(co&&!ms.has(co)){ms.add(co);mc.push(co);}if(po&&po!==co&&!mp.includes(po)) mp.push(po);if(po&&po!==co) mpsa=false;
  });
  var mcl='',mpl='';
  if(mpsa||mp.length===0){mcl=mc.length?'  Contract / PO No. : '+mc.join(' / '):''}
  else{mcl=mc.length?'  Contract          : '+mc.join(' / '):'';mpl=mp.length?'  PO No.            : '+mp.join(' / '):'';}
  var previewBody=['Dear Sir/Madam,','','Please kindly find the attached shipping schedule.','',
    ...[mcl,mpl,'  Buyer             : '+b.buyer].filter(Boolean),
    '','Please feel free to contact us if you have any questions.','','Thanks,','Best regards,','',
    'LEENEAR CORPORATION','TEL: +81-3-3528-9850  FAX: +81-3-3528-9851',
    'E-mail: rcp@leenearcorp.com','Web: www.leenearcorp.com',
    '─────────────────────────────────────────','✦ Powered by LEENAI Automation System'].join('\n');
  document.getElementById('modalBody').innerHTML=
    '<div class="modal-field"><label>TO</label><div class="val">'+escHtml(b.emailTo||'（送付先なし）')+'</div></div>'+
    '<div class="modal-field"><label>CC</label><div class="val">'+escHtml(cc||'—')+'</div></div>'+
    '<div class="modal-field"><label>件名</label><div class="val">'+escHtml(subject)+'</div></div>'+
    '<div class="modal-field"><label>本文</label><div class="val" style="white-space:pre-line;font-size:.8rem">'+escHtml(previewBody)+'</div></div>'+
    '<div class="modal-field"><label>添付ファイル</label><div class="val">📎 Shipping Schedule_'+escHtml(b.buyer)+'_'+ymd+'.xlsx　（'+b.rows.length+'行）</div></div>'+
    '<div class="modal-field"><label>スケジュール (ETD昇順・先頭5件)</label><div style="overflow-x:auto">'+
    '<table style="width:100%;font-size:.72rem;border-collapse:collapse">'+
    '<thead style="background:var(--frame);color:var(--text)"><tr><th style="padding:5px 8px">ETD</th><th>ETA</th><th>Invoice</th><th>Carrier</th><th>Vessel</th><th>POL</th><th>POD</th><th>Container</th></tr></thead>'+
    '<tbody>'+rows_preview+more+'</tbody></table></div></div>';
  var sendBtn=document.getElementById('modalSendBtn'),mailtoBtn=document.getElementById('modalMailtoBtn');
  if(b.sendType==='nomail'){sendBtn.disabled=true;sendBtn.textContent='送付先なし';mailtoBtn.style.display='none';}
  else{sendBtn.disabled=false;sendBtn.textContent='📎 送付';
    sendBtn.onclick=function(){closeModalDirect();sendOneGraph(idx);};
    mailtoBtn.onclick=function(){closeModalDirect();sendOne(idx);};}
  document.getElementById('modalOverlay').classList.add('open');
}

function previewSelected(){
  var targets=buyerData.filter(function(b){return b.selected;});
  if(!targets.length){alert('バイヤーを選択してください。');return;}
  var idx=filteredData.indexOf(targets[0]);if(idx>=0) previewOne(idx);
}
function closeModal(e){if(e.target===document.getElementById('modalOverlay')) closeModalDirect();}
function closeModalDirect(){document.getElementById('modalOverlay').classList.remove('open');}

/* ═══════════════════════════════════════════
   ユーティリティ
═══════════════════════════════════════════ */
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function showError(msg){var el=document.getElementById('errorMsg');if(msg){el.textContent=msg;el.style.display='block';}else{el.style.display='none';}}
var logLines=[];
function log(msg){logLines=[];document.getElementById('progressLog').innerHTML='';}
function addLog(msg,cls){
  logLines.push({msg:msg,cls:cls});
  var el=document.getElementById('progressLog');
  el.innerHTML+='<div class="'+(cls?'log-'+cls:'')+'">'+escHtml(msg)+'</div>';
  el.scrollTop=el.scrollHeight;
  document.getElementById('progressWrap').style.display='block';
}
function setProgress(pct,msg){document.getElementById('progressBar').style.width=pct+'%';if(msg) addLog(msg);}
</script>
