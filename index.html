<style>
/* ── B-02 固有 CSS ── */
:root{--radius:10px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;font-size:13px;}
main{max-width:1100px;margin:0 auto;padding:20px 16px 80px;display:flex;flex-direction:column;gap:14px;}
.card{background:var(--read);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
.card-title{font-weight:700;font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--accent-btn);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
.folder-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
#fileStatus{font-size:12px;color:var(--text2);font-family:monospace;background:var(--surface2);padding:8px 14px;border-radius:8px;border:1px solid var(--border);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#fileStatus.ok{color:var(--ok);border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.05);}
#errorMsg{color:var(--danger);font-size:12px;margin-top:8px;display:none;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:6px;padding:8px 12px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;transition:all .15s;white-space:nowrap;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:var(--accent-btn);color:#fff;}.btn-primary:hover:not(:disabled){filter:brightness(1.08);}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}.btn-ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.btn-ok{background:var(--ok);color:#fff;}.btn-ok:hover:not(:disabled){filter:brightness(1.1);}
.btn-danger{background:var(--danger);color:#fff;}.btn-danger:hover:not(:disabled){filter:brightness(1.1);}
#summaryBar{display:none;gap:10px;flex-wrap:wrap;}
.stat-pill{background:var(--read);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;}
.stat-pill strong{color:var(--text);font-size:15px;font-weight:700;}
#controls{display:none;align-items:center;gap:8px;flex-wrap:wrap;}
#searchBox{flex:1;min-width:180px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:13px;outline:none;transition:border .15s;}
#searchBox:focus{border-color:var(--accent);}
#searchBox::placeholder{color:var(--text3);}
#tableWrap{display:none;overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{background:var(--frame);color:var(--text);padding:9px 12px;text-align:left;font-weight:700;font-size:11px;letter-spacing:.05em;white-space:nowrap;position:sticky;top:0;}
thead th input[type=checkbox]{width:14px;height:14px;cursor:pointer;}
tbody tr{transition:background .1s;}
tbody tr:nth-child(even){background:var(--surface2);}
tbody tr:hover{background:rgba(79,142,247,.06);}
tbody td{padding:8px 12px;border-bottom:1px solid rgba(46,51,80,.4);vertical-align:middle;}
tbody td:first-child{text-align:center;}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;}
.badge-agent{background:rgba(79,142,247,.15);color:var(--accent);}
.badge-importer{background:rgba(34,197,94,.15);color:var(--ok);}
.badge-direct{background:rgba(245,158,11,.15);color:var(--warn);}
.badge-nomail{background:rgba(239,68,68,.15);color:var(--danger);}
.email-cell{font-family:monospace;font-size:11px;color:var(--text2);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#sendPanel{display:none;position:sticky;bottom:0;background:var(--frame);border-top:1px solid var(--border);padding:12px 24px;align-items:center;gap:12px;z-index:99;box-shadow:0 -4px 20px rgba(0,0,0,.3);}
#sendPanel .sel-info{color:var(--text2);font-size:13px;flex:1;}
#sendPanel .sel-info strong{color:var(--accent);font-size:15px;}
#progressWrap{display:none;margin-top:12px;}
.progress-bar-outer{width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.progress-bar-inner{height:100%;background:var(--ok);border-radius:3px;transition:width .3s;}
#progressLog{margin-top:8px;max-height:140px;overflow-y:auto;font-family:monospace;font-size:12px;color:var(--text2);line-height:1.8;}
.log-ok{color:var(--ok);}.log-warn{color:var(--warn);}.log-err{color:var(--danger);}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--read);border:1px solid var(--border);border-radius:12px;width:680px;max-width:96vw;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.modal-header{background:var(--surface2);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.modal-header h3{font-size:14px;font-weight:700;}
.modal-close{background:none;border:none;color:var(--text2);font-size:16px;cursor:pointer;padding:0 4px;line-height:1;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:18px 20px;overflow-y:auto;flex:1;}
.modal-field{margin-bottom:12px;}
.modal-field label{display:block;font-size:10px;font-weight:700;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;}
.modal-field .val{font-size:12px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px 12px;font-family:monospace;word-break:break-all;}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
@media print{.ln-header,.ln-footer,.card{display:none!important;}}
</style>
</head>

<script>
/* ── D365 / COMPASS ── */
var D365 = {
  orgUrl:  'https://orgde512c6f.crm7.dynamics.com',
  apiBase: 'https://orgde512c6f.crm7.dynamics.com/api/data/v9.2/',
  scope:   'https://orgde512c6f.crm7.dynamics.com/user_impersonation offline_access',
};

/* ── 統合の材料 (null = 未到着) ── */
var scheduleRowsGlobal = null;   // ① COMPASS 結果
var mailMapGlobal      = null;   // ② 送付先 — マスター取得失敗時は {} (全員 送付先なし)
var mailMasterFailed   = false;

/* ── 状態 ── */
var buyerData         = [];
var filteredData      = [];
var currentModalBuyer = null;

/* ═══════════════════════════════════════════
   LEENAI 初期化
═══════════════════════════════════════════ */
function startTool(){
  loadSalesMailMaster();
  loadFromD365();
}

LEENAI.init({
  sys:         'B-02',
  name:        '出荷スケジュール 送付ツール',
  version:     '4.5',
  date:        '2026-10-28',
  desc:        'COMPASSデータと送付先マスターから出荷スケジュールを一括送付します',
  onReady:     startTool,
  redirectUri: 'https://mhlee205.github.io/SHIPPING_SCHEDULE/',
});

/* ── ローディング (共通に委譲) ── */
function showLoading(msg){ LEENAI.loading.show(msg||'データ取得中...'); }
function hideLoading(){ LEENAI.loading.hide(); }

/* ═══════════════════════════════════════════
   COMPASS + 送付先マスター 統合 (表を描くのはここだけ)
═══════════════════════════════════════════ */
function mergeIfReady(){
  if(scheduleRowsGlobal===null||mailMapGlobal===null) return;   // どちらか未到着なら待つ
  buildBuyerData(scheduleRowsGlobal,mailMapGlobal);
  if(mailMasterFailed) addLog('⚠️ 送付先マスターなし — 全バイヤー送付不可で表示','warn');
  else addLog('✅ 完了 (COMPASS+送付先マスター統合)','ok');
}

/* ═══════════════════════════════════════════
   送付先マスター (共通マスター sales_mail)
═══════════════════════════════════════════ */
function buildMailMapFromMaster(items){
  var map={};
  (items||[]).forEach(function(it){
    var agent=String(it.agent||'').trim(),buyer=String(it.buyer||'').trim();
    var to=String(it.to||'').trim();
    var cc=String(it.cc||'').split(/[;,\/\s]+/).map(function(s){return s.trim();}).filter(Boolean);
    if(!to) return;   // TO なしの行は無視 (マスター入力検査で本来は入らない)
    map[agent+'::'+buyer]={to:to,cc:cc.join(';'),agent:agent,buyer:buyer};
  });
  return map;
}

async function loadSalesMailMaster(){
  var statusEl=document.getElementById('mailMasterStatus');
  statusEl.textContent='⟳ 送付先マスター取得中...';
  try{
    var items=await LEENAI.master.get('sales_mail');
    mailMapGlobal=buildMailMapFromMaster(items);mailMasterFailed=false;
    var n=Object.keys(mailMapGlobal).length;
    statusEl.textContent='📋 送付先マスター（販売先メール） ✅ '+n+'件 — 変更はヘッダーの ⚙ マスター設定から';
    statusEl.style.color='';
    addLog('📧 送付先マスター: '+n+' 件','ok');
  }catch(e){
    mailMapGlobal={};mailMasterFailed=true;   // 表は出すが全員 送付先なし (送付ボタンなし)
    statusEl.textContent='❌ 送付先マスターを読み込めません — 送付はできません。⚙ マスター設定を確認してください';
    statusEl.style.color='var(--danger)';
    addLog('❌ 送付先マスター取得失敗: '+e.message,'err');
  }
  mergeIfReady();
}

/* ═══════════════════════════════════════════
   メール内容 (件名・本文・CC・添付名) — 4経路共通、唯一の定義
═══════════════════════════════════════════ */
var SIGNATURE_LINES=['Thanks,','Best regards,','',
  'LEENEAR CORPORATION','TEL: +81-3-3528-9850  FAX: +81-3-3528-9851',
  'E-mail: rcp@leenearcorp.com','Web: www.leenearcorp.com',
  '─────────────────────────────────────────','✦ Powered by LEENAI Automation System'];

function buildMailParts(b){
  var ymd=todayYMD();
  var contracts=[],poNos=[],seen=new Set(),poSameAsCo=true;
  b.rows.forEach(function(r){
    var co=(r.coNo||'').toString().trim(),po=(r.poNo||'').toString().trim();
    if(co&&!seen.has(co)){seen.add(co);contracts.push(co);}
    if(po&&po!==co&&!poNos.includes(po)) poNos.push(po);
    if(po&&po!==co) poSameAsCo=false;
  });
  var contractLine='',poLine='';
  if(poSameAsCo||poNos.length===0){contractLine=contracts.length?'  Contract / PO No. : '+contracts.join(' / '):'';}
  else{contractLine=contracts.length?'  Contract          : '+contracts.join(' / '):'';poLine=poNos.length?'  PO No.            : '+poNos.join(' / '):'';}
  var infoLines=[contractLine,poLine,'  Buyer             : '+b.buyer].filter(Boolean);
  var bodyLines=['Dear Sir/Madam,','','Please kindly find the attached shipping schedule.','']
    .concat(infoLines,['','Please feel free to contact us if you have any questions.',''],SIGNATURE_LINES);
  var cc=[b.emailCC,'rcp@leenearcorp.com']
    .flatMap(function(s){return (s||'').split(';');}).map(function(s){return s.trim();}).filter(Boolean)
    .filter(function(v,i,a){return a.indexOf(v)===i;});
  return {
    subject:'[LEENEAR AutoSend] '+b.buyer+' - Shipping Schedule '+ymd,
    bodyLines:bodyLines,
    cc:cc,
    fileName:'Shipping Schedule_'+b.buyer+'_'+ymd+'.xlsx'
  };
}

/* ── Graph メッセージ (送付・下書き共通) ── */
function buildGraphMessage(b){
  var p=buildMailParts(b);
  var bytes=new Uint8Array(generateExcel(b)),binary='';
  for(var i=0;i<bytes.length;i+=8192){binary+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));}
  return {subject:p.subject,body:{contentType:'Text',content:p.bodyLines.join('\r\n')},
    toRecipients:[{emailAddress:{address:b.emailTo}}],
    ccRecipients:p.cc.map(function(addr){return {emailAddress:{address:addr}};}),
    attachments:[{'@odata.type':'#microsoft.graph.fileAttachment',name:p.fileName,
      contentType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',contentBytes:btoa(binary)}]};
}

/* ═══════════════════════════════════════════
   Graph API: メール送信
═══════════════════════════════════════════ */
async function sendMailGraph(b){
  var grTok=await LEENAI.auth.token('graph');
  if(!grTok) throw new Error('Outlookへの接続がありません。再ログインしてください。');
  var message=buildGraphMessage(b);
  var resp=await fetch('https://graph.microsoft.com/v1.0/me/sendMail',{method:'POST',
    headers:{'Authorization':'Bearer '+grTok,'Content-Type':'application/json'},
    body:JSON.stringify({message:message,saveToSentItems:true})});
  if(resp.status===202) return true;
  if(resp.status===401) throw new Error('トークンが期限切れです。再度ログインしてください。');
  var err=await resp.text();
  throw new Error('Graph API エラー ('+resp.status+'): '+err);
}

/* ═══════════════════════════════════════════
   Graph API: 下書き保存
═══════════════════════════════════════════ */
async function sendMailDraft(b){
  var grTok=await LEENAI.auth.token('graph');
  if(!grTok) throw new Error('Outlookへの接続がありません。再ログインしてください。');
  var message=buildGraphMessage(b);
  var resp=await fetch('https://graph.microsoft.com/v1.0/me/messages',{method:'POST',
    headers:{'Authorization':'Bearer '+grTok,'Content-Type':'application/json'},body:JSON.stringify(message)});
  if(resp.status===201){var draft=await resp.json();return draft.id;}
  if(resp.status===401) throw new Error('トークンが期限切れです。再度ログインしてください。');
  var err2=await resp.text();
  throw new Error('Graph API エラー ('+resp.status+'): '+err2);
}

async function sendOneDraft(idx){
  var b=filteredData[idx];if(!b||b.sendType==='nomail') return;
  try{addLog('📝 '+b.buyer+': 下書き保存中...','');await sendMailDraft(b);addLog('✅ '+b.buyer+': Outlookの下書きに保存しました','ok');}
  catch(e){addLog('❌ '+b.buyer+': '+e.message,'err');alert('失敗 ('+b.buyer+'): '+e.message);}
}

async function sendSelectedDraft(){
  var targets=buyerData.filter(function(b){return b.selected&&b.sendType!=='nomail';});
  if(!targets.length){alert('送付可能なバイヤーが選択されていません。');return;}
  document.getElementById('progressWrap').style.display='block';setProgress(0,'');log('');
  var ok=0,ng=0;
  for(var i=0;i<targets.length;i++){
    var b=targets[i];
    setProgress(Math.round((i/targets.length)*100),b.buyer+' 下書き保存中... ('+(i+1)+'/'+targets.length+')');
    try{await sendMailDraft(b);addLog('✅ '+b.buyer+': 下書き保存完了','ok');ok++;}
    catch(e){addLog('❌ '+b.buyer+': '+e.message,'err');ng++;}
    await sleep(500);
  }
  setProgress(100,'完了 (下書き保存): 成功 '+ok+'件 / 失敗 '+ng+'件');
}

async function sendOneGraph(idx){
  var b=filteredData[idx];if(!b||b.sendType==='nomail') return;
  try{addLog('📤 '+b.buyer+': 送付中...','');await sendMailGraph(b);addLog('✅ '+b.buyer+': 送付完了','ok');}
  catch(e){addLog('❌ '+b.buyer+': '+e.message,'err');alert('失敗 ('+b.buyer+'): '+e.message);}
}

async function sendSelectedGraph(){
  var targets=buyerData.filter(function(b){return b.selected&&b.sendType!=='nomail';});
  if(!targets.length){alert('送付可能なバイヤーが選択されていません。');return;}
  document.getElementById('progressWrap').style.display='block';setProgress(0,'');log('');
  var ok=0,ng=0;
  for(var i=0;i<targets.length;i++){
    var b=targets[i];
    setProgress(Math.round((i/targets.length)*100),b.buyer+' 送信中... ('+(i+1)+'/'+targets.length+')');
    try{await sendMailGraph(b);addLog('✅ '+b.buyer+': 送付完了','ok');ok++;}
    catch(e){addLog('❌ '+b.buyer+': '+e.message,'err');ng++;}
    await sleep(500);
  }
  setProgress(100,'完了 (送付): 成功 '+ok+'件 / 失敗 '+ng+'件');
}

/* ═══════════════════════════════════════════
   D365 API
═══════════════════════════════════════════ */
async function d365Get(relUrl,token){
  var url=relUrl.startsWith('http')?relUrl:D365.apiBase+relUrl;
  var resp=await fetch(url,{headers:{'Authorization':'Bearer '+token,'Accept':'application/json',
    'OData-MaxVersion':'4.0','OData-Version':'4.0','Prefer':'odata.include-annotations="*"'}});
  if(!resp.ok){var txt=await resp.text();throw new Error('D365 API エラー '+resp.status+': '+txt.slice(0,200));}
  var data=await resp.json();return data.value||data;
}

async function fetchActiveContractGuids(token){
  addLog('🔍 Step1: 未完了契約を取得中...','');
  var contractGuids=new Set();
  var url='cr49f_sale_details?$filter=cr49f_closing eq false&$select=cr49f_sale_detail_id,_cr49f_sale_contract_id_value&$top=500';
  while(url){
    var page=await d365Get(url,token);
    var rows=Array.isArray(page)?page:(page.value||[page]);
    rows.forEach(function(r){if(r._cr49f_sale_contract_id_value) contractGuids.add(r._cr49f_sale_contract_id_value);});
    url=page['@odata.nextLink']||null;
  }
  addLog('✅ Step1完了: 未完了契約 '+contractGuids.size+' 件','ok');
  return [...contractGuids];
}

async function fetchBookingsByContracts(contractGuids,token){
  addLog('📦 Step2: ブッキング情報を取得中...','');
  var all=[],CHUNK=10;
  for(var i=0;i<contractGuids.length;i+=CHUNK){
    var chunk=contractGuids.slice(i,i+CHUNK);
    var filter=chunk.map(function(g){return '_cr49f_sale_contract_id_value eq '+g;}).join(' or ');
    var expand='cr49f_sale_contract_id($select=cr49f_sale_contract_no,cr49f_sale_contract_date,cr49f_latest_shipment,cr49f_po_no;$expand=cr49f_buyer_id($select=cr49f_buyer_name,cr49f_buyer),cr49f_agent_id($select=cr49f_agent_name,cr49f_agent)),cr49f_carrier_id($select=crcf9_carrier),cr49f_region_japan_id($select=crcf9_pol),cr49f_region_id($select=cr49f_pod)';
    var url2='cr49f_bookings?$filter='+filter+'&$select=cr49f_bookingid,cr49f_bl_number,cr49f_booking_no,cr49f_invoice_no,cr49f_main_ship_name,cr49f_etd,cr49f_eta,crcf9_bl_etd,crcf9_bl_eta,_cr49f_sale_contract_id_value&$expand='+expand;
    var rows=await d365Get(url2,token);
    all.push.apply(all,Array.isArray(rows)?rows:[rows]);
    setProgress(20+Math.round(30*(i/contractGuids.length)),'ブッキング取得中 '+all.length+'件...');
  }
  addLog('✅ Step2完了: ブッキング '+all.length+' 件','ok');
  return all;
}

async function fetchContainerInfos(bookingGuids,token){
  addLog('🚢 Step3: コンテナ情報を取得中...','');
  var all=[],CHUNK=10;
  for(var i=0;i<bookingGuids.length;i+=CHUNK){
    var chunk=bookingGuids.slice(i,i+CHUNK);
    var filter=chunk.map(function(g){return '_crcf9_booking_id_value eq '+g;}).join(' or ');
    var url2='crcf9_container_informations?$filter='+filter+'&$select=crcf9_container_informationid,_crcf9_booking_id_value,crcf9_n_w,crcf9_container_no,crcf9_type&$expand=crcf9_item_id($select=cr49f_item,cr49f_item_name),crcf9_sale_detail_id($select=cr49f_price,cr49f_quantity,cr49f_price_yen,cr49f_sale_detailid)';
    var rows=await d365Get(url2,token);
    all.push.apply(all,Array.isArray(rows)?rows:[rows]);
    setProgress(50+Math.round(30*(i/bookingGuids.length)),'コンテナ情報取得中 '+all.length+'件...');
  }
  // 円単価の補完 (v4.5) — 一覧の $expand では cr49f_price_yen が空で来ることがある (DOC-Z-06 §5-1) → USD 単価なしの明細だけ 1 件ずつ取得
  var need={};
  all.forEach(function(ci){
    var sd=ci.crcf9_sale_detail_id;
    if(sd&&sd.cr49f_sale_detailid&&(sd.cr49f_price==null||Number(sd.cr49f_price)===0)&&sd.cr49f_price_yen==null)
      (need[sd.cr49f_sale_detailid]=need[sd.cr49f_sale_detailid]||[]).push(sd);
  });
  var sdIds=Object.keys(need);
  for(var k=0;k<sdIds.length;k++){
    try{
      var d=await d365Get('cr49f_sale_details('+sdIds[k]+')?$select=cr49f_price_yen',token);
      need[sdIds[k]].forEach(function(sd){sd.cr49f_price_yen=d.cr49f_price_yen;});
    }catch(e){addLog('⚠️ 円単価取得失敗: '+sdIds[k],'warn');}
  }
  addLog('💴 円単価 補完取得: '+sdIds.length+' 件','');
  addLog('✅ Step3完了: コンテナ情報 '+all.length+' 行','ok');
  return all;
}

function buildScheduleRowsFromD365(bookings,containerInfos){
  var ciByBooking={};
  containerInfos.forEach(function(ci){
    var bkId=ci._crcf9_booking_id_value;
    if(!ciByBooking[bkId]) ciByBooking[bkId]=[];
    ciByBooking[bkId].push(ci);
  });
  var rows=[];
  bookings.forEach(function(bk){
    var sc=bk.cr49f_sale_contract_id||{};
    var bd=sc.cr49f_buyer_id||{},ad=sc.cr49f_agent_id||{};
    var buyerName=(bd.cr49f_buyer||'').trim();
    var agentRaw=(ad.cr49f_agent||'').toString().trim();
    var agentName=/^\d+$/.test(agentRaw)?'':agentRaw;
    var carrier=bk.cr49f_carrier_id&&bk.cr49f_carrier_id.crcf9_carrier||'';
    var pol=bk.cr49f_region_japan_id&&bk.cr49f_region_japan_id.crcf9_pol||'';
    var pod=bk.cr49f_region_id&&bk.cr49f_region_id.cr49f_pod||'';
    var blDate=bk.crcf9_bl_etd?bk.crcf9_bl_etd.slice(0,10).replace(/-/g,'/'):'';
    var blDateRaw=bk.crcf9_bl_etd?new Date(bk.crcf9_bl_etd):null;
    var etaRaw_=bk.crcf9_bl_eta||bk.cr49f_eta||null;
    var eta=etaRaw_?etaRaw_.slice(0,10).replace(/-/g,'/'):'';
    var etdRaw=bk.cr49f_etd?new Date(bk.cr49f_etd):null;
    var cts=ciByBooking[bk.cr49f_bookingid]||[];
    var containerCount=cts.length,comboMap={};
    cts.forEach(function(ci){
      var item=ci.crcf9_item_id&&ci.crcf9_item_id.cr49f_item||'';
      var price=ci.crcf9_sale_detail_id&&ci.crcf9_sale_detail_id.cr49f_price!=null?ci.crcf9_sale_detail_id.cr49f_price:'';
      // 単価 (v4.5): USD (MT 単価) があればそのまま (v4.4 と同じキー) / なければ円 (KG 単価, COMPASS の値そのまま)
      var yen=ci.crcf9_sale_detail_id&&ci.crcf9_sale_detail_id.cr49f_price_yen!=null?ci.crcf9_sale_detail_id.cr49f_price_yen:null,up;
      if(price!==''&&Number(price)!==0) up={cur:'USD',v:Number(price)};
      else if(yen!=null&&Number(yen)!==0){price='JPY'+yen;up={cur:'JPY',v:Number(yen)};}
      else up={cur:'',v:null};
      var qty=Number(ci.crcf9_sale_detail_id&&ci.crcf9_sale_detail_id.cr49f_quantity||0);
      var nwKg=ci.crcf9_n_w!=null?Number(ci.crcf9_n_w):0;
      var key=item+'||'+price;
      if(!comboMap[key]) comboMap[key]={item:item,price:price,up:up,qty:qty,netWkg:0};
      comboMap[key].netWkg+=nwKg;
    });
    var totalNWkg=Object.values(comboMap).reduce(function(s,c){return s+c.netWkg;},0);
    if(totalNWkg===0&&containerCount===0) return;
    var coNo=sc.cr49f_sale_contract_no||'',nwMap={},qtyMap={},upMap={};
    Object.values(comboMap).forEach(function(combo){
      var key=coNo+'||'+combo.item+'||'+combo.price;
      nwMap[key]=Math.round(combo.netWkg/10)/100;qtyMap[key]=combo.qty;upMap[key]=combo.up;
    });
    rows.push({buyer:buyerName,agent:agentName,invoiceNo:bk.cr49f_invoice_no||'',
      blNo:bk.cr49f_bl_number||'',bookingNo:bk.cr49f_booking_no||'',vessel:bk.cr49f_main_ship_name||'',
      carrier:carrier,pol:pol,pod:pod,blDate:blDate,blDateRaw:blDateRaw,eta:eta,etdRaw:etdRaw,
      coNo:coNo,poNo:sc.cr49f_po_no||'',container:String(containerCount),nwMap:nwMap,qtyMap:qtyMap,upMap:upMap});
  });
  rows.sort(function(a,b){
    var da=a.blDateRaw||a.etdRaw,db=b.blDateRaw||b.etdRaw;
    if(!da&&!db) return 0;if(!da) return 1;if(!db) return -1;return da-db;
  });
  return rows;
}

function buildBuyerData(scheduleRows,mailMap){
  var groups={};
  scheduleRows.forEach(function(r){if(!groups[r.buyer]) groups[r.buyer]=[];groups[r.buyer].push(r);});
  Object.values(groups).forEach(function(rows){
    rows.sort(function(a,b){
      var da=a.blDateRaw||a.etdRaw,db=b.blDateRaw||b.etdRaw;
      if(!da&&!db) return 0;if(!da) return 1;if(!db) return -1;return da-db;
    });
  });
  buyerData=Object.entries(groups).map(function(entry){
    var buyer=entry[0],rows=entry[1];
    var agent=(rows[0].agent||'').toString().trim();
    var agentIsZero=agent===''||/^\d+$/.test(agent);
    var resolved=null,sendType='';
    if(!agentIsZero){
      var ik=agent+'::'+buyer;
      if(mailMap[ik]){resolved=mailMap[ik];sendType='importer';}
      else{var ak=agent+'::';if(mailMap[ak]){resolved=mailMap[ak];sendType='agent';}}
    }else{var dk='::'+buyer;if(mailMap[dk]){resolved=mailMap[dk];sendType='direct';}}
    var vd=rows.map(function(r){return r.etdRaw;}).filter(Boolean);
    return{buyer:buyer,agent:agentIsZero?'':agent,rows:rows,
      emailTo:resolved?resolved.to:'',emailCC:resolved?resolved.cc:'',
      sendType:resolved?sendType:'nomail',
      etdMin:vd.length?new Date(Math.min.apply(null,vd)):null,
      etdMax:vd.length?new Date(Math.max.apply(null,vd)):null,selected:false};
  });
  buyerData.sort(function(a,b){return a.buyer.localeCompare(b.buyer);});
  filteredData=[...buyerData];
  renderStats();renderTable();
  document.getElementById('summaryBar').style.display='flex';
  document.getElementById('controls').style.display='flex';
  document.getElementById('tableWrap').style.display='block';
  document.getElementById('sendPanel').style.display='flex';
}

async function loadFromD365(){
  showError('');setProgress(0,'');log('');
  var btn=document.getElementById('btnD365Load');
  if(btn) btn.disabled=true;
  try{
    showLoading('COMPASSからデータ取得中...');
    addLog('🔐 D365トークン取得中...','');setProgress(5,'D365認証中...');
    var token=await LEENAI.auth.token('dataverse');
    setProgress(10,'未完了契約を検索中...');
    var contractGuids=await fetchActiveContractGuids(token);
    if(contractGuids.length===0){addLog('⚠️ 未完了契約が見つかりませんでした。','warn');hideLoading();if(btn) btn.disabled=false;return;}
    setProgress(20,'ブッキング情報を取得中...');
    var bookings=await fetchBookingsByContracts(contractGuids,token);
    var bookingGuids=bookings.map(function(b){return b.cr49f_bookingid;}).filter(Boolean);
    setProgress(50,'コンテナ情報を取得中...');
    var containerInfos=await fetchContainerInfos(bookingGuids,token);
    setProgress(80,'データを組み立て中...');
    var scheduleRows=buildScheduleRowsFromD365(bookings,containerInfos);
    addLog('📊 スケジュールデータ: '+scheduleRows.length+' 行','ok');
    setProgress(90,'送付先マスターと統合中...');
    scheduleRowsGlobal=scheduleRows;   // ① 到着
    mergeIfReady();
    setProgress(100,'');
    document.getElementById('d365Status').textContent='✅ COMPASSデータ取得完了 ('+scheduleRows.length+'行)';
    document.getElementById('d365Status').style.color='var(--ok)';
  }catch(e){
    showError('D365エラー: '+e.message);addLog('❌ '+e.message,'err');
    document.getElementById('d365Status').textContent='❌ 取得失敗';
    document.getElementById('d365Status').style.color='var(--danger)';
  }finally{hideLoading();if(btn) btn.disabled=false;}
}

/* ═══════════════════════════════════════════
   日付変換
═══════════════════════════════════════════ */
function toJsDate(v){
  if(!v) return null;if(v instanceof Date) return v;
  if(typeof v==='number') return new Date(Math.round((v-25569)*86400*1000));
  if(typeof v==='string'&&v.trim()){var d=new Date(v);return isNaN(d)?null:d;}
  return null;
}
function excelDateToStr(v){var d=toJsDate(v);if(!d) return '';
  return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');}
function dateToYMD(d){if(!d) return '';
  return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');}
function todayYMD(){return dateToYMD(new Date()).replace(/\//g,'');}

function renderStats(){
  document.getElementById('statBuyers').textContent=buyerData.length;
  document.getElementById('statRows').textContent=buyerData.reduce(function(s,b){return s+b.rows.length;},0);
  document.getElementById('statMailable').textContent=buyerData.filter(function(b){return b.sendType!=='nomail';}).length;
  document.getElementById('statNomail').textContent=buyerData.filter(function(b){return b.sendType==='nomail';}).length;
}

function renderTable(){
  var tbody=document.getElementById('buyerTbody');tbody.innerHTML='';
  filteredData.forEach(function(b,idx){
    var tr=document.createElement('tr');tr.dataset.idx=idx;
    var etdRange=(b.etdMin&&b.etdMax)?dateToYMD(b.etdMin)+' 〜 '+dateToYMD(b.etdMax):'—';
    var typeBadge={agent:'<span class="badge badge-agent">Agent</span>',
      importer:'<span class="badge badge-importer">Importer直送</span>',
      direct:'<span class="badge badge-direct">Direct</span>',
      nomail:'<span class="badge badge-nomail">送付先なし</span>'}[b.sendType]||'';
    tr.innerHTML='<td><input type="checkbox" '+(b.selected?'checked':'')+' onchange="toggleRow('+idx+',this)"></td>'+
      '<td><strong>'+escHtml(b.buyer)+'</strong></td>'+
      '<td style="color:var(--text2);font-size:11px">'+escHtml(b.agent||'—')+'</td>'+
      '<td>'+typeBadge+'</td>'+
      '<td class="email-cell" title="'+escHtml(b.emailTo)+'">'+escHtml(b.emailTo||'—')+'</td>'+
      '<td class="email-cell" style="font-size:.68rem" title="'+escHtml(b.emailCC)+'">'+escHtml(b.emailCC?b.emailCC.split(';').join('\n'):'—')+'</td>'+
      '<td style="text-align:center">'+b.rows.length+'</td>'+
      '<td style="font-size:.76rem;white-space:nowrap">'+etdRange+'</td>'+
      '<td><button class="btn btn-ghost" style="font-size:.75rem;padding:5px 10px" onclick="previewOne('+idx+')">👁 確認</button>'+
      (b.sendType!=='nomail'?'<button class="btn btn-ok" style="font-size:.75rem;padding:5px 10px;margin-left:4px" onclick="sendOneGraph('+idx+')">📎 送付</button>'+
        '<button class="btn btn-ghost" style="font-size:.75rem;padding:5px 10px;margin-left:4px" onclick="sendOneDraft('+idx+')">📝 下書き</button>':'')+
      '</td>';
    tbody.appendChild(tr);
  });
  updateSelCount();
}

function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toggleAll(chk){filteredData.forEach(function(b){b.selected=chk.checked;});buyerData.forEach(function(b){if(filteredData.includes(b)) b.selected=chk.checked;});renderTable();}
function toggleRow(idx,chk){filteredData[idx].selected=chk.checked;updateSelCount();}
function selectAll(v){filteredData.forEach(function(b){b.selected=v;});buyerData.forEach(function(b){b.selected=v;});renderTable();}
function selectMailable(){filteredData.forEach(function(b){b.selected=b.sendType!=='nomail';});buyerData.forEach(function(b){b.selected=filteredData.includes(b)?b.selected:false;});renderTable();}
function updateSelCount(){document.getElementById('selCount').textContent=buyerData.filter(function(b){return b.selected;}).length;}
function filterTable(){
  var q=document.getElementById('searchBox').value.toLowerCase();
  filteredData=q?buyerData.filter(function(b){return b.buyer.toLowerCase().includes(q);}):([...buyerData]);
  renderTable();
}

function generateExcel(b){
  var wb2=XLSX.utils.book_new(),ws={};
  var enc=function(r,c){return XLSX.utils.encode_cell({r:r,c:c});};
  var NAVY='0F2044',LBLUE='D6E4F0',HBLUE='2E75B6',WHITE='FFFFFF',GRAY='F2F2F2',TOTAL='BDD7EE';
  var fnt=function(bold,color,sz){return {bold:bold,color:{rgb:color||'000000'},sz:sz||9,name:'Arial'};};
  var fill=function(c){return {patternType:'solid',fgColor:{rgb:c}};};
  var aln=function(h,v,wrap){return {horizontal:h||'center',vertical:v||'center',wrapText:!!wrap};};
  var bdr=function(style,color){var s={style:style||'thin',color:{rgb:color||'9DC3E6'}};return {top:s,bottom:s,left:s,right:s};};
  var bdrMed=function(){var s={style:'medium',color:{rgb:NAVY}};return {top:s,bottom:s,left:s,right:s};};
  var setC=function(addr,v,s){ws[addr]={v:v,t:typeof v==='number'?'n':'s',s:s||{}};};
  var setN=function(addr,v,s){ws[addr]={v:Number(v)||0,t:'n',s:s||{}};};
  var combos=[],seen=new Set();
  b.rows.forEach(function(r){Object.keys(r.nwMap).forEach(function(key){
    if(!seen.has(key)){seen.add(key);var p=key.split('||');combos.push({key:key,co:p[0],item:p[1],up:(r.upMap||{})[key]||{cur:'',v:null},qty:r.qtyMap[key]||0,po:r.poNo||''});}
  });});
  // 並び: 契約 → 品目 → 単価 (単価なしは後ろ) — キーは行データのものをそのまま使う (v4.5, 組み立て直さない)
  var upCmp=function(a,b2){var x=a.up.v,y=b2.up.v;if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return x-y;};
  combos.sort(function(a,b2){return a.co.localeCompare(b2.co)||a.item.localeCompare(b2.item)||upCmp(a,b2);});
  var yenFmt=function(v){return '¥'+(Math.round(Number(v)*100)/100).toLocaleString('en-US',{maximumFractionDigits:2})+'/KG';};
  var N_FIXED=10;
  setC(enc(0,0),'Buyer',{font:fnt(true,NAVY,9),alignment:aln('left')});
  setC(enc(0,1),b.buyer,{font:fnt(true,NAVY,11),alignment:aln('left')});
  for(var r=1;r<=4;r++){for(var c=0;c<9;c++){ws[enc(r,c)]={v:'',t:'s',s:{fill:fill(LBLUE)}};}}
  setC(enc(1,0),b.buyer,{font:fnt(true,NAVY,22),fill:fill(LBLUE),alignment:aln('center','center')});
  ['CO_NO','PO_NO','GRADE','U/P'].forEach(function(lbl,bi){
    var row=1+bi;
    setC(enc(row,9),lbl,{font:fnt(true,WHITE,8),fill:fill(HBLUE),alignment:aln('center'),border:bdr()});
    combos.forEach(function(combo,ci){
      var v=bi===0?combo.co:bi===1?combo.po:bi===2?combo.item:combo.up.v;
      var col=N_FIXED+ci;
      if(bi===3){
        if(combo.up.cur==='USD') setN(enc(row,col),v,{font:fnt(false,NAVY,8),fill:fill(LBLUE),alignment:aln('center'),border:bdr(),numFmt:'#,##0'});
        else setC(enc(row,col),combo.up.cur==='JPY'?yenFmt(v):'',{font:fnt(false,NAVY,8),fill:fill(LBLUE),alignment:aln('center'),border:bdr()});
      }
      else{setC(enc(row,col),String(v||''),{font:fnt(bi===0,NAVY,8),fill:fill(LBLUE),alignment:aln('center'),border:bdr()});}
    });
  });
  var HDR_ROW=5;
  ['BL DATE','ETA','Invoice No.','Carrier','Vessel','Booking No.','BL No.','POL','POD','Container'].forEach(function(h,i){
    setC(enc(HDR_ROW,i),h,{font:fnt(true,WHITE,9),fill:fill(NAVY),alignment:aln('center','center',true),border:bdr()});
  });
  combos.forEach(function(combo,ci){setC(enc(HDR_ROW,N_FIXED+ci),combo.qty+' MT',{font:fnt(true,WHITE,8),fill:fill(NAVY),alignment:aln('center'),border:bdr()});});
  var DATA_START=6;
  b.rows.forEach(function(r,ri){
    var row=DATA_START+ri,bg=ri%2===0?WHITE:GRAY;
    [r.blDate,r.eta,r.invoiceNo,r.carrier,r.vessel,r.bookingNo,r.blNo||'',r.pol,r.pod,r.container].forEach(function(v,ci){
      setC(enc(row,ci),String(v||''),{font:fnt(ci===0,'000000',8),fill:fill(bg),alignment:aln('center'),border:bdr()});
    });
    combos.forEach(function(combo,ci){
      var col=N_FIXED+ci,key=combo.key,nw=r.nwMap[key];
      if(nw){setN(enc(row,col),Math.round(Number(nw)*100)/100,{font:fnt(false,'000000',8),fill:fill(bg),alignment:aln('right'),border:bdr(),numFmt:'#,##0.00'});}
      else{ws[enc(row,col)]={v:'',t:'s',s:{fill:fill(bg),border:bdr()}};}
    });
  });
  var TOTAL_ROW=DATA_START+b.rows.length;
  for(var c2=0;c2<N_FIXED;c2++){ws[enc(TOTAL_ROW,c2)]={v:c2===0?'Total':'',t:'s',s:{font:fnt(true,NAVY,9),fill:fill(TOTAL),alignment:aln(c2===0?'center':'left'),border:bdrMed()}};}
  combos.forEach(function(combo,ci){
    var key=combo.key;
    var total=b.rows.reduce(function(sum,r){return sum+(Number(r.nwMap[key])||0);},0);
    setN(enc(TOTAL_ROW,N_FIXED+ci),Math.round(total*100)/100,{font:fnt(true,NAVY,9),fill:fill(TOTAL),alignment:aln('right'),border:bdrMed(),numFmt:'#,##0.00'});
  });
  ws['!merges']=[{s:{r:0,c:1},e:{r:0,c:5}},{s:{r:1,c:0},e:{r:4,c:8}},{s:{r:TOTAL_ROW,c:0},e:{r:TOTAL_ROW,c:N_FIXED-1}}];
  ws['!cols']=[...[11,11,14,10,24,15,18,9,10,13].map(function(w){return {wch:w};}), ...combos.map(function(){return {wch:10};})];
  ws['!rows']=Array.from({length:TOTAL_ROW+1},function(_,i){
    if(i>=1&&i<=4) return {hpt:18};if(i===HDR_ROW) return {hpt:20};if(i===TOTAL_ROW) return {hpt:18};return {hpt:15};
  });
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:TOTAL_ROW,c:N_FIXED+combos.length-1}});
  ws['!pageSetup']={orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0};
  XLSX.utils.book_append_sheet(wb2,ws,'Shipping Schedule');
  return XLSX.write(wb2,{bookType:'xlsx',type:'array',cellStyles:true});
}

/* ═══════════════════════════════════════════
   mailto / 送付
═══════════════════════════════════════════ */
function buildMailto(b){
  var p=buildMailParts(b);
  return 'mailto:'+encodeURIComponent(b.emailTo)+'?subject='+encodeURIComponent(p.subject)+'&body='+encodeURIComponent(p.bodyLines.join('\r\n'))+(p.cc.length?'&cc='+encodeURIComponent(p.cc.join(';')):'');
}

function downloadExcel(b){
  var data=generateExcel(b);
  var blob=new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=buildMailParts(b).fileName;a.click();
  setTimeout(function(){URL.revokeObjectURL(url);},5000);
}

async function sendOne(idx){
  var b=filteredData[idx];if(!b||b.sendType==='nomail') return;
  downloadExcel(b);await sleep(400);window.location.href=buildMailto(b);
  addLog('📤 '+b.buyer+' → Outlook を開きました','ok');
}

async function sendSelected(){
  var targets=buyerData.filter(function(b){return b.selected&&b.sendType!=='nomail';});
  if(!targets.length){alert('送付可能なバイヤーが選択されていません。');return;}
  document.getElementById('progressWrap').style.display='block';setProgress(0,'');log('');
  for(var i=0;i<targets.length;i++){
    var b=targets[i];setProgress(Math.round((i/targets.length)*100),b.buyer+' を処理中...');
    addLog('📄 '+b.buyer+': Excel生成 → ダウンロード','');downloadExcel(b);await sleep(600);
    addLog('📤 '+b.buyer+': Outlook 起動','ok');window.location.href=buildMailto(b);await sleep(1500);
  }
  setProgress(100,'完了');addLog('✅ '+targets.length+' 件の処理が完了しました','ok');
}

/* ═══════════════════════════════════════════
   プレビュー Modal
═══════════════════════════════════════════ */
function previewOne(idx){
  var b=filteredData[idx];currentModalBuyer=b;
  var p=buildMailParts(b);
  document.getElementById('modalTitle').textContent='メール確認 — '+b.buyer;
  var rows_preview=b.rows.slice(0,5).map(function(r){
    return '<tr><td>'+escHtml(r.blDate)+'</td><td>'+escHtml(r.eta)+'</td><td>'+escHtml(r.invoiceNo)+'</td><td>'+escHtml(r.carrier)+'</td><td>'+escHtml(r.vessel)+'</td><td>'+escHtml(r.pol)+'</td><td>'+escHtml(r.pod)+'</td><td>'+escHtml(r.container)+'</td></tr>';
  }).join('');
  var more=b.rows.length>5?'<tr><td colspan="8" style="text-align:center;color:var(--text3);font-size:.75rem">... 他 '+(b.rows.length-5)+' 行</td></tr>':'';
  document.getElementById('modalBody').innerHTML=
    '<div class="modal-field"><label>TO</label><div class="val">'+escHtml(b.emailTo||'（送付先なし）')+'</div></div>'+
    '<div class="modal-field"><label>CC</label><div class="val">'+escHtml(p.cc.join('、')||'—')+'</div></div>'+
    '<div class="modal-field"><label>件名</label><div class="val">'+escHtml(p.subject)+'</div></div>'+
    '<div class="modal-field"><label>本文</label><div class="val" style="white-space:pre-line;font-size:.8rem">'+escHtml(p.bodyLines.join('\n'))+'</div></div>'+
    '<div class="modal-field"><label>添付ファイル</label><div class="val">📎 '+escHtml(p.fileName)+'　（'+b.rows.length+'行）</div></div>'+
    '<div class="modal-field"><label>スケジュール (BL DATE昇順・先頭5件)</label><div style="overflow-x:auto">'+
    '<table style="width:100%;font-size:.72rem;border-collapse:collapse">'+
    '<thead style="background:var(--frame);color:var(--text)"><tr><th style="padding:5px 8px">BL DATE</th><th>ETA</th><th>Invoice</th><th>Carrier</th><th>Vessel</th><th>POL</th><th>POD</th><th>Container</th></tr></thead>'+
    '<tbody>'+rows_preview+more+'</tbody></table></div></div>';
  var sendBtn=document.getElementById('modalSendBtn'),mailtoBtn=document.getElementById('modalMailtoBtn');
  if(b.sendType==='nomail'){sendBtn.disabled=true;sendBtn.textContent='送付先なし';mailtoBtn.style.display='none';}
  else{sendBtn.disabled=false;sendBtn.textContent='📎 送付';
    sendBtn.onclick=function(){closeModalDirect();sendOneGraph(idx);};
    mailtoBtn.onclick=function(){closeModalDirect();sendOne(idx);};}
  document.getElementById('modalOverlay').classList.add('open');
}

function previewSelected(){
  var targets=buyerData.filter(function(b){return b.selected;});
  if(!targets.length){alert('バイヤーを選択してください。');return;}
  var idx=filteredData.indexOf(targets[0]);if(idx>=0) previewOne(idx);
}
function closeModal(e){if(e.target===document.getElementById('modalOverlay')) closeModalDirect();}
function closeModalDirect(){document.getElementById('modalOverlay').classList.remove('open');}

/* ═══════════════════════════════════════════
   ユーティリティ
═══════════════════════════════════════════ */
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function showError(msg){var el=document.getElementById('errorMsg');if(msg){el.textContent=msg;el.style.display='block';}else{el.style.display='none';}}
var logLines=[];
function log(msg){logLines=[];document.getElementById('progressLog').innerHTML='';}
function addLog(msg,cls){
  logLines.push({msg:msg,cls:cls});
  var el=document.getElementById('progressLog');
  el.innerHTML+='<div class="'+(cls?'log-'+cls:'')+'">'+escHtml(msg)+'</div>';
  el.scrollTop=el.scrollHeight;
  document.getElementById('progressWrap').style.display='block';
}
function setProgress(pct,msg){document.getElementById('progressBar').style.width=pct+'%';if(msg) addLog(msg);}
</script>
